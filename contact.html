<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us - ABC Kids Fun World</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="index.js"></script>
   
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <main>
        <div class="contact-container">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <p>Feel free to reach out with any inquiries.<br>We'd love to hear from you!</p>
            </div>
            
            <div class="contact-details">
                <div class="info-item">
              <a href="https://www.instagram.com/abcwrldkenya/" aria-label="Instagram"><i class='bx bxl-instagram'></i></a>
              <p>abcwrld@kenya</p>
            </div>
            <div class="info-item">
              <a href="https://twitter.com/abckidsfunwrld" aria-label="Twitter"><i class='bx bxl-twitter' ></i></a>
              <p>abckidsfunwrld</p>
            </div>
            <div class="info-item">
              <a href="https://www.facebook.com/abckidskenya/" aria-label="Facebook"><i class='bx bxl-facebook'></i></a>
              <p>abckids@kenya</p>
            </div>`
            <div class="info-item">
                <a href="tel:+254123456789" aria-label="Phone"><i class='bx bx-phone'></i></a>
                <p>+254 123 456 789</p>
            </div>
            <div class="info-item">
                <a href="mailto:info@abckidsfunworld.com" aria-label="Email"><i class='bx bx-envelope'></i></a>
                <p>Feel free to email us at info@abckidsfunworld.com</p>
            </div>
            </div>

            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
            <button type="submit">Send Message</button>
            </form>
        </div>
    </main>

</body>
</html>
