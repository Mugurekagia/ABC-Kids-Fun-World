<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us - ABC Kids Fun World</title>
    <link rel="stylesheet" href="contact.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
   
</head>
<body>
    <header>
        <h1>Contact Us</h1>
      

    </header>
    <main>
        <div class="contact-form-container">
        <div class="contact-section">
                <h2>Get in Touch</h2>
            
            <div class="tabs">
                <button class="tab active" data-tab="contact">Contact Info</button>
                <button class="tab" data-tab="social">Social-Media</button>
                </div>

                <div class="tab-content" id="contact">
                    <div class="contact-card">
                        <div class="icon">
                            <i class='bx bx-envelope'></i>  
                        </div>
                        <div class="detail">
                            <p>Email</p>
                            <p>abckidsfunworld@gmail.com</p>
                        </div>
                    </div>
                    <div class="contact-card">
                        <div class="icon">
                            <i class='bx bx-phone'></i> 
                    </div>
                    <div class="detail">
                        <p>Phone</p>
                        <p>+254 123 456 789</p>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="icon">
                        <i class='bx bx-map'></i>
                    </div>
                <div class="detail">
                    <p>Location</p>
                    <p>Nairobi, Kenya</p>
                </div>
            </div>
        </div>
         <div class="tab-content" id="social">
                <div class="social-media-card">
                    <div class="icon">
                        <i class='bx bxl-instagram'></i>
                    </div>
                    <div class="detail">
                        <a href="https://www.instagram.com/abcwrldkenya/" aria-label="Instagram">
                        <p>Instagram</p>
                    </a>
                        <p>abcwrld@kenya</p>
                    </div>
                </div>
                    <div class="social-media-card">
                        <div class="icon">
                            <i class='bx bxl-twitter'></i> 
                        </div>
                        <div class="detail">
                            <a href="https://twitter.com/abckidsfunwrld.ke" aria-label="Twitter">
                            <p>Twitter</p>
                        </a>
                            <p>abckidsfunwrld.ke</p>
                    </div>
                </div>
                <div class="social-media-card">
                    <div class="icon">
                        <i class='bx bxl-facebook'></i>
                    </div>
                    <div class="detail">
                        <a href="https://www.facebook.com/abckidskenya/" aria-label="Facebook">
                        <p>Facebook</p>
                    </a>
                        <p>abckids@kenya</p>
                </div>
            </div>
        </div>
       
    </div> 

            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
            <button type="submit">Send Message</button>
            </form>
        </div>
        <p class="bottom-sentence">Feel free to reach out with any inquiries.<br>We'd love to hear from you!</p>
    </main>
    <script>
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        document.getElementById('contact').classList.add('active');
        tabs[0].classList.add('active');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabId = tab.dataset.tab;

                tabContents.forEach(content => {
                    content.classList.remove('active');
                });
                tabs.forEach(t => {
                    t.classList.remove('active');
                });
                document.getElementById(tabId).classList.add('active');

                tab.classList.add('active');
            });
        });
    </script>

</body>
</html>
